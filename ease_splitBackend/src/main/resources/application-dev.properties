spring.application.name=ease_splitBackend

# Development H2 File Database (Zero PostgreSQL Permissions required!)
spring.datasource.url=jdbc:h2:file:./data/easesplitdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Enable H2 Web Console at http://localhost:8080/h2-console
spring.h2.console.enabled=true
